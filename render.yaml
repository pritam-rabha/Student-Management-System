services:
  - type: web
    name: student-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set in the Render dashboard; never commit a real hash or password.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Set to "false" to start with an empty data file instead of demo data.
      - key: SEED_SAMPLE_DATA
        value: "true"
